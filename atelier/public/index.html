<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — musée de ville</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Cap Web</h1>
    <p>Assistant du musée de ville, pour les visiteurs.</p>
    <form id="chat-form">
      <label for="message">Votre message</label>
      <textarea id="message" name="message" rows="3" maxlength="100"></textarea>
      <button type="submit">Envoyer</button>
    </form>
    <ul id="suggestions">
      <li><button type="button">Quels sont les horaires de visite ?</button></li>
      <li><button type="button">Y a-t-il des visites guidées ?</button></li>
      <li><button type="button">Quels sont les tarifs (adultes, enfants, étudiants) ?</button></li>
    </ul>
    <ul id="messages"></ul>
    <button type="button" id="effacer">Effacer la conversation</button>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
